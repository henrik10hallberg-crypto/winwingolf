/10/valleromano1.jpeg|r=1/1|w=100","h":"Valle Romano","x":"Spanien bjuder på många alternativ. Valle Romano är en bra anläggning med prisvärd golf och boende."},{"img":"bilder/2022/12/20160531_Parnu_Bay_Golf_Links_Course_JM_0010.JPG-1600x1014-1.jpg|r=1/1|w=100","h":"Pärnu Golf Bay","x":"Vill man prova något nytt och riktigt lyxigt är Pärnu Golf Bay i Estland ett spännande alternativ."}]},{"t":"h3","x":"Företagsgolf"},{"t":"h4","x":"För företagets anställda"},{"t":"p","x":"Låt golfen bli en gemensam aktivitet på företaget. Bjud in kollegorna till en rolig golftävling. Vi ordnar allt från inbjudan till att boka starttider, prisbord och kanske en gemensam lunch eller middag efter tävlingen. Om ni har verksamhet på flera platser i landet kan vi ordna lokala deltävlingar med efterföljande finalspel."},{"t":"h4","x":"För era viktigaste kunder"},{"t":"p","x":"Det är alltid uppskattat att bli inbjuden till en golftävling. Ta tillfället i akt och presentera nya medarbetare, nya tjänster eller produkter eller gör ett seminarium efter tävlingen då ni bjuder in någon intressant föredragshållare. Kontakta gärna oss om ni vill ta hjälp."},{"t":"btn","x":"Intresseanmälan","to":"intresseanmalan"}]},"sponsortavlingar":{"blocks":[{"t":"h1","x":"Sponsortävlingar"},{"t":"img","img":"bilder/2023/10/Skarmavbild-2023-10-20-kl.-17.13.31.png|w=75|r=4/3"},{"t":"h2","x":"Vi genomför tävlingar för våra sponsorer"},{"t":"p","x":"Marknadsföring via golftävlingar är en spännande möjlighet för varumärken som vill nå ut till sina kunder. Men det gäller att göra ett riktigt bra event där både sponsorer, golfklubbar och de tävlande blir nöjda. Det ska vara Win Win."},{"t":"h3","x":"Vi ordnar allt."},{"t":"h4","x":"Allt från att boka, marknadsföra och genomföra."},{"t":"p","x":"Vi bokar in tävlingen på en bra golfklubb i Sverige.\nVi hjälper klubbarna med marknadsföringen av tävlingen.\nVi planerar och genomför tävlingarna på plats.\nVi dokumenterar och rapporterar i sociala medier"},{"t":"h4","x":"Framgångsfaktorer"},{"t":"p","x":"Att vi är ute i god tid.\nAtt vi är tydliga med syfte, mål och budskap.\nAtt vi är på plats och tar ansvar.\nAtt vi utvärderar och mäter effekterna."},{"t":"btn","x":"Intresseanmälan","to":"intresseanmalan"},{"t":"cards","items":[{"img":"bilder/2023/06/IMG_5787.jpeg|w=100|r=4/3","h":"Huvudsponsor","x":"Huvudsponsorn för tävlingen är med och planerar tävlingens utformning, namn och omfattning."},{"img":"bilder/2023/10/IMG_5841-scaled.jpg|r=4/3|w=100","h":"Delsponsorer","x":"Som delsponsor får man möjlighet att synas och kommunicera med sin målgrupp."},{"img":"bilder/2023/10/Skarmavbild-2023-10-27-kl.-18.37.40.png|w=100|r=4/3","h":"Aktiviteter","x":"För att tävlingen ska bli lyckad och omtyckt föreslår vi lämpliga aktiviteter ute på banan."},{"img":"bilder/2023/10/Skarmavbild-2023-10-27-kl.-18.39.57.png|w=100|r=4/3","h":"Marknadsföring","x":"Före, under och efter tävlingen ger naturliga möjligheter att kommunicera med målgruppen."}]}]},"om-oss":{"blocks":[{"t":"h1","x":"Vårt team"},{"t":"img","img":"bilder/2022/10/w.png|w=25"},{"t":"h2","x":"Vi älskar att tävla."},{"t":"p","x":"Vi satte oss ned en kväll och pratade om vad vi allra helst skulle vilja göra. Vi spelar alla mycket golf och vi älskar att tävla. Vi har upplevt allt från stora Europatouren till den lilla golfresan med sonen. Vi har lärt oss att uppskatta vad som är bra och undvika det som kan gå dåligt. Tänk om vi kunde hjälpa andra att både få göra den perfekta golfresan och samtidigt tävla som lag!\nDär och då föddes Win Win Golf."},{"t":"cards","items":[{"img":"bilder/2022/10/teamstaffan-1024x768.jpg|w=100|r=4/3","h":"Staffan Hallberg","x":"Founder\n+46708669700\nstaffan@winwingolf.se"},{"img":"bilder/2022/10/teammikael2.jpg|w=100|r=4/3","h":"Mikael Guslin","x":"CFO\n+46707136722\nmikael@winwingolf.se"},{"img":"bilder/2023/08/thumbnail_Skarmavbild-2023-08-16-kl.-12.23.-png.png|w=100|r=4/3","h":"Henrik Hallberg","x":"CEO\n+46732565635\nhenrik@winwingolf.se"},{"img":"bilder/2 <script>
let C=JSON.parse(document.getElementById("data").textContent),edit=false,U=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=p=>p.split(".").reduce((o,k)=>o[k],C);
const set=(p,v)=>{const k=p.split("."),l=k.pop();k.reduce((o,x)=>o[x],C)[l]=v};
const T=(p,tag="span",cls="")=>`<${tag} data-p="${p}"${cls?` class="${cls}"`:""}${edit?' contenteditable="plaintext-only"':""}>${esc(F(get(p)))}</${tag}>`;
const L=(href,cls,inner)=>edit?`<span class="${cls}">${inner}</span>`:`<a class="${cls}" href="${href}">${inner}</a>`;
const add=p=>edit?`<button class="mini" data-add="${p}">+ Lägg till</button>`:"";
const del=p=>edit?`<button class="mini x" data-del="${p}" aria-label="Ta bort">×</button>`:"";
const parse=v=>{const[u,...r]=v.split("|"),o={};r.forEach(x=>{const i=x.indexOf("=");o[x.slice(0,i)]=x.slice(i+1)});return[u,o]};
const put=(u,o)=>u+Object.entries(o).filter(([k,v])=>v).map(([k,v])=>`|${k}=${v}`).join("");
const src=u=>u.startsWith("u:")?(C.site.base||"https://winwingolf.se/wp-content/uploads/")+u.slice(2):u;

const OPT=(p,k,cur,list)=>`<select data-io="${p}" data-k="${k}" aria-label="${k}">${list.map(([v,l])=>`<option value="${v}"${(cur||"")===v?" selected":""}>${l}</option>`).join("")}</select>`;
const IP=(p,full)=>{if(!edit)return"";const[u,o]=parse(get(p));return `<div class="ic"><button class="mini" data-img="${p}">Byt bild</button>${u?`<button class="mini" data-imgx="${p}">Ta bort bild</button>`:""}${full?"":OPT(p,"w",o.w,[["","Bredd: auto"],["25","25 %"],["33","33 %"],["50","50 %"],["66","66 %"],["75","75 %"],["100","100 %"]])+OPT(p,"r",o.r,[["","Form: original"],["16/9","16:9"],["3/2","3:2"],["4/3","4:3"],["1/1","Kvadrat"],["21/9","Bred 21:9"],["3/1","Banner 3:1"]])+OPT(p,"a",o.a,[["","Vänster"],["c","Mitten"],["r","Höger"]])}</div>`};
const IM=(p,c="",hero)=>{const[u,o]=parse(get(p));let st="";if(!hero)st=`width:${o.w?o.w+"%":(u?"fit-content":"100%")};max-width:100%;`+(o.a==="c"?"margin-inline:auto;":o.a==="r"?"margin-left:auto;":"")+(o.r?`aspect-ratio:${o.r};`:"");
const w=`<div class="imw ${c}${o.r&&!hero?" fx":""}${u?"":" ph"}"${st?` style="${st}"`:""}>${u?`<img src="${esc(src(u))}" alt=""${u===C.site.logo?' class="logo-fx"':""}>`:""}</div>`;return hero?w:`<div class="imx">${w}${IP(p)}</div>`};
const PL={hem:"Startsida",intresseanmalan:"Intresseanmälan",anmalan:"Anmälan"};
const TO=p=>edit?`<select class="to" data-to="${p}.to" aria-label="Länk till sida"><option value="">Ingen länk</option>${Object.keys(C.pages).filter(k=>k!=="anmalan").map(k=>`<option value="${k}"${get(p+".to")===k?" selected":""}>Länk: ${esc(PL[k]||k)}</option>`).join("")}${ROWS().map(r=>`<option value="anmalan/${esc(r.id)}"${get(p+".to")==="anmalan/"+r.id?" selected":""}>Anmälan: ${esc(r.name)}</option>`).join("")}</select>`:"";
const MORE=(b,P)=>(b.to?L("#/"+b.to,"more",b.more!=null?T(P+".more"):"Läs mer &gt;"):"")+TO(P);
const W=x=>`<section class="s"><div class="wrap">${x}</div></section>`;
const B={
h1:(b,P)=>W(T(P+".x","h1")),
score:(b,P)=>W(`<div class="card">${T(P+".h","h2")}<div class="scroll"><table class="tbl"><thead><tr><th>Tävling</th><th>Datum</th><th>Status</th><th>Anmälan</th><th>Antal spelare</th></tr></thead><tbody>${b.rows.map((r,i)=>{const R=P+".rows."+i;
const st=edit?`<select data-sts="${R}.status" aria-label="Status">${Object.entries(ST).map(([v,l])=>`<option value="${v}"${r.status===v?" selected":""}>${l}</option>`).join("")}</select>`:`<span class="tag ${esc(r.status)}">${ST[r.status]||esc(r.status)}</span>`;
const an=edit?`<span class="btn sm">Anmäl dig här</span><br>${TO(R).replace('<option value="">Ingen länk</option>','<option value="">Ingen knapp</option>')}`:!r.to?`<span class="na">–</span>`:r.status==="open"?`<a class="btn sm" href="#/${esc(r.to)}">Anmäl dig här</a>`:`<span class="na">${{soon:"Öppnar snart",full:"Fullbokad",done:"Avslutad"}[r.status]||"–"}</span>`;
const ap=edit?`<label class="sub">Anmälda <input type="number" min="0" data-cnt="${esc(r.id)}" value="${cnt(r)}"></label><label class="sub">Max platser <input type="number" min="0" data-max="${R}.max" value="${esc(r.max||"")}"></label><label class="sub">Per anmälan <select data-per="${R}.per">${[1,2,3,4].map(n=>`<option value="${n}"${+(r.per||2)===n?" selected":""}>${n} spelare</option>`).join("")}</select></label>`:`<span class="cv" data-cv="${esc(r.id)}">${fmt(r)}</span>`;
return `<tr><td>${T(R+".name")}${del(R)}</td><td>${T(R+".date")}</td><td>${st}</td><td>${an}</td><td>${ap}</td></tr>`}).join("")}</tbody></table></div>${add(P+".rows")}</div>`),
hero:(b,P,i)=>`<div class="hero" style="min-height:min(60vh,${b.hh||26}rem)">${IM(P+".img","",1)}<div class="wrap">${IP(P+".img",1)}${edit?`<div class="ic"><select data-hh="${i}" aria-label="Höjd">${[[14,"Låg"],[20,"Mellan"],[26,"Hög"],[34,"Extra hög"]].map(([v,l])=>`<option value="${v}"${+(b.hh||26)===v?" selected":""}>Höjd: ${l}</option>`).join("")}</select></div>`:""}${T(P+".h","h1")}</div></div>`,
h2:(b,P)=>W(T(P+".x","h2")),h3:(b,P)=>W(T(P+".x","h3")),h4:(b,P)=>W(T(P+".x","h4")),
p:(b,P)=>W(T(P+".x","p")),lead:(b,P)=>W(T(P+".x","p","lead")),
btn:(b,P)=>W(L("#/"+b.to,"btn",T(P+".x"))+TO(P)),
img:(b,P)=>W(IM(P+".img","pic")),
it:(b,P,i,n)=>W(`<div class="it${n%2?" r":""}">${IM(P+".img")}<div>${T(P+".h","h2")}${T(P+".x","p")}${MORE(b,P)}</div></div>`),
banner:(b,P)=>W(`<div class="ban">${IM(P+".img")}<div>${T(P+".h","h3")}${T(P+".sub","h2")}${T(P+".date","p","date")}${MORE(b,P)}</div></div>`),
quote:(b,P)=>`<section class="q"><div class="wrap">${T(P+".x","p")}</div></section>`,
list:(b,P)=>W(T(P+".h","h3")+`<ul class="help">${b.items.map((c,j)=>`<li><strong>${T(P+".items."+j+".h")}</strong>${T(P+".items."+j+".x")}${del(P+".items."+j)}</li>`).join("")}</ul>${add(P+".items")}`),
cards:(b,P)=>W(`<div class="cards">${b.items.map((c,j)=>`<div class="c">${IM(P+".items."+j+".img")}${T(P+".items."+j+".h","h3")}${T(P+".items."+j+".x","p")}${del(P+".items."+j)}</div>`).join("")}</div>${add(P+".items")}`),
gallery:(b,P)=>W(`<div class="gal">${b.imgs.map((_,j)=>IM(P+".imgs."+j)).join("")}</div>`),
signup:(b,P)=>W(`${edit?`<div class="tb"><p>Den här sidan är en mall som används för alla tävlingar i tabellen "Kommande tävlingar". {tävling} och {datum} byts automatiskt mot tävlingens namn och datum.</p>${CUR?`<p>Mall-ID för mejlet till deltagarna i ${esc(CUR.name)} (EmailJS): <input data-ctpl value="${esc(CUR.tpl||"")}" style="width:12rem"></p>`:""}<p>Standard-mall-ID (används om tävlingen saknar eget): ${T(P+".tpl")}</p></div>`:!CUR?`<p>Det finns ingen öppen tävling just nu.</p>`:CUR.status==="soon"?`<p><strong>Anmälan till ${esc(CUR.name)} öppnar snart.</strong></p>`:CUR.status!=="open"?`<p><strong>Anmälan till ${esc(CUR.name)} är stängd (${ST[CUR.status]||""}).</strong></p>`:""}${!edit&&(!CUR||CUR.status!=="open")?"":`<form id="signup"><label>Ditt namn<input name="namn" required autocomplete="name"></label><label>Din partners namn<input name="partner" required autocomplete="off"></label><label>Telefon<input name="tel" type="tel" required autocomplete="tel"></label><label>Mejladress<input name="epost" type="email" required autocomplete="email"></label><button class="btn" type="submit">Anmäl er</button><p class="msg" role="status" aria-live="polite"></p></form>`}`),
form:()=>W(`<form id="form"><label>Namn<input name="namn" required autocomplete="name"></label><label>Telefon<input name="tel" type="tel" autocomplete="tel"></label><label>Vad gäller det?<select name="typ"><option>Tävla med vänner</option><option>Tävla mot andra</option><option>Företagsgolf</option><option>Sponsortävling</option><option>Annat</option></select></label><label>Antal personer<input name="antal" inputmode="numeric"></label><label>Berätta om er<textarea name="msg" rows="4"></textarea></label><button class="btn" type="submit">Skicka via e-post</button></form>`)};
const NEW={h2:{t:"h2",x:"Ny rubrik"},h3:{t:"h3",x:"Ny underrubrik"},p:{t:"p",x:"Ny text"},it:{t:"it",img:"",h:"Ny rubrik",x:"Ny text",to:""},btn:{t:"btn",x:"Knapp",to:"intresseanmalan"},img:{t:"img",img:""}};
const NL={h2:"Rubrik",h3:"Underrubrik",p:"Text",it:"Bild + text",btn:"Knapp",img:"Bild"};
let CUR=null;
const ROWS=()=>Object.values(C.pages).flatMap(pg=>pg.blocks.filter(b=>b.t==="score").flatMap(b=>b.rows));
const ids=()=>ROWS().forEach(r=>{if(!r.id)r.id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);if(r.to===undefined)r.to="anmalan/"+r.id});
/* Antal spelare: anmälningar räknas i en gratis räknartjänst (abacus). Visat antal = räknarens värde + justering som redaktören sätter. */
const CNT="https://abacus.jasoncameron.dev",CNS="winwingolf",HITS={},HREQ={};
const ckey=id=>encodeURIComponent(("wwg-"+id).replace(/[^A-Za-z0-9_.-]/g,"-").slice(0,64));
const cnt=r=>Math.max(0,(+r.adj||0)+(HITS[r.id]||0));
const fmt=r=>r.max?`${cnt(r)} / ${r.max}`:String(cnt(r));
const paint=()=>{document.querySelectorAll("[data-cv]").forEach(el=>{const r=ROWS().find(x=>x.id===el.dataset.cv);if(r)el.textContent=fmt(r)});document.querySelectorAll("[data-cnt]").forEach(el=>{const r=ROWS().find(x=>x.id===el.dataset.cnt);if(r&&el!==document.activeElement)el.value=cnt(r)})};
const loadHits=()=>ROWS().forEach(r=>{if(HREQ[r.id])return;HREQ[r.id]=1;fetch(`${CNT}/get/${CNS}/${ckey(r.id)}`).then(x=>x.ok?x.json():{value:0}).then(j=>{HITS[r.id]=+j.value||0;paint()}).catch(()=>{})});
const hit=async(r,n)=>{for(let k=0;k<n;k++){try{const j=await(await fetch(`${CNT}/hit/${CNS}/${ckey(r.id)}`)).json();HITS[r.id]=+j.value||0}catch(e){}}};
const cur=()=>{const[k,id]=(location.hash.replace(/^#\/?/,"")||"hem").split("/");CUR=null;if(k==="anmalan"){const R=ROWS();CUR=R.find(r=>r.id===id)||R.find(r=>r.status==="open")||null}return C.pages[k]?k:"hem"};
const F=v=>edit||v==null?(v==null?"":v):String(v).replace(/\{tävling\}/g,CUR?CUR.name:"").replace(/\{datum\}/g,CUR?CUR.date:"");
function render(){ids();const k=cur();{const lb=k==="hem"?"":k==="anmalan"&&CUR?"Anmälan: "+CUR.name:(C.menu.find(m=>m.page===k)||{}).label||PL[k]||"";document.title=lb?lb+" – "+C.site.name:C.site.name}let n=0;document.body.classList.toggle("edit",edit);C.menu.forEach(m=>PL[m.page]=m.label);
const blocks=C.pages[k].blocks.map((b,i)=>{const P=`pages.${k}.blocks.${i}`,tb=edit?`<div class="wrap tb"><button class="mini" data-mv="${i}" data-d="-1">↑ Upp</button><button class="mini" data-mv="${i}" data-d="1">↓ Ner</button><button class="mini" data-rm="${i}">Ta bort avsnitt</button></div>`:"";const h=tb+B[b.t](b,P,i,n);if(b.t==="it")n++;return h}).join("");
const ms=edit?`<div class="wrap tb">Meny: ${C.menu.map((m,i)=>`<input class="ml" data-ml="${i}" value="${esc(m.label)}" aria-label="Menynamn"><button class="mini" data-mdel="${i}" aria-label="Ta bort">×</button>`).join(" ")}<button class="mini" data-newpage>+ Ny sida</button><br>Bildmapp: <input data-base="" value="${esc(C.site.base||"")}" style="width:min(28rem,100%)" aria-label="Bildmapp"><br>Anmälningsmejl (EmailJS): Service-ID <input data-ejs="service" value="${esc(EJ().service||"")}" style="width:9rem"> Public key <input data-ejs="key" value="${esc(EJ().key||"")}" style="width:11rem"> Mall-ID till oss <input data-ejs="admin" value="${esc(EJ().admin||"")}" style="width:9rem">${U?"":GHP()}</div>`:"";
const pal=edit?`<div class="pal wrap">Lägg till avsnitt: ${Object.keys(NEW).map(t=>`<button class="mini" data-nb="${t}">${NL[t]}</button>`).join("")}</div>`:"";
loadHits();$("#app").innerHTML=`<header><div class="wrap">${edit?`<span class="brand">${C.site.logo?`<img class="logo-img" src="${esc(src(C.site.logo))}" alt="">`:""}${T("site.name","span","logo")}</span>`:`<a class="logo" href="#/">${C.site.logo?`<img class="logo-img" src="${esc(src(C.site.logo))}" alt="">`:""}${esc(C.site.name)}</a>`}<nav aria-label="Huvudmeny">${C.menu.map(m=>`<a href="#/${m.page}"${m.page===k?' aria-current="page"':""}>${esc(m.label)}</a>`).join("")}<a href="#/intresseanmalan"${k==="intresseanmalan"?' aria-current="page"':""}>Intresseanmälan</a></nav></div></header>${ms}<main>${blocks}${pal}</main><footer><div class="wrap"><h3>${esc(C.site.name)}</h3>${T("site.tag","p")}<p><a href="#/om-oss">Läs mer</a></p><h3>Kontakt</h3><p>${edit?T("site.email")+"<br>"+T("site.phone"):`<a href="mailto:${esc(C.site.email)}">${esc(C.site.email)}</a><br><a href="tel:${esc(C.site.phone.replace(/[^0-9+]/g,""))}">${esc(C.site.phone)}</a>`}</p>${T("site.copy","p")}</div></footer>`;bar()}
function bar(msg){const b=$("#bar");if(!(U||/[?&]redigera/.test(location.search))){b.hidden=true;return}document.body.classList.add("canedit");b.hidden=false;
b.innerHTML=edit?`<span>${msg||"Klicka på en text för att ändra den"}</span>${U?'<button class="btn" data-a="save">Spara</button>':'<button class="btn" data-a="ghsave">Spara på webbplatsen</button>'}<button class="btn" data-a="dl">Ladda ner sidan</button><button class="btn ghost" data-a="cancel">Avbryt</button>`:`<button class="btn" data-a="edit">Redigera sidan</button>`}
function snap(){const c=document.documentElement.cloneNode(true),b=c.querySelector("#bar");c.removeAttribute("data-theme");c.removeAttribute("style");c.removeAttribute("class");c.querySelector("#app").innerHTML="";b.innerHTML="";b.hidden=true;c.querySelector("body").className="";c.querySelector("#data").textContent=JSON.stringify(C).replace(/</g,"\\u003c");return "<!doctype html>\n"+c.outerHTML}
const GH=()=>{try{return JSON.parse(localStorage.getItem("wwg-gh")||"{}")}catch(e){return{}}};
const GHs=o=>{try{localStorage.setItem("wwg-gh",JSON.stringify({...GH(),...o}))}catch(e){}};
const GHP=()=>{const g=GH(),f=(k,l,t="text",w="9rem")=>`${l} <input data-gh="${k}" type="${t}" value="${esc(g[k]||"")}" style="width:${w}" aria-label="${l}" autocomplete="off">`;return `<br>Publicering via GitHub: ${f("user","Användare")} ${f("repo","Repo")} ${f("branch","Gren","text","5rem")} ${f("token","Token","password","12rem")}`};
async function ghSave(){const g=GH();if(!g.user||!g.repo||!g.token){bar("Fyll i användare, repo och token under menyn först");return}
const br=g.branch||"main",api=`https://api.github.com/repos/${g.user}/${g.repo}/contents/`,h={Authorization:"Bearer "+g.token,Accept:"application/vnd.github+json","Content-Type":"application/json"};
const send=async(path,b64,msg)=>{let sha;const r=await fetch(api+path+"?ref="+encodeURIComponent(br),{headers:h});if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw new Error(r.status);const w=await fetch(api+path,{method:"PUT",headers:h,body:JSON.stringify({message:msg,content:b64,branch:br,...(sha?{sha}:{})})});if(!w.ok)throw new Error(w.status)};
let n=0;const walk=async o=>{for(const k in o){const v=o[k];if(typeof v==="string"&&v.startsWith("data:image")){const[u,op]=parse(v),png=u.startsWith("data:image/png"),name=`bilder/bild-${Date.now()}-${n++}.${png?"png":"jpg"}`;bar("Laddar upp bild "+n+"…");await send(name,u.split(",")[1],"Ny bild");o[k]=put(name,op)}else if(v&&typeof v==="object")await walk(v)}};
try{bar("Sparar…");await walk(C);render();bar("Sparar sidan…");await send("index.html",btoa(unescape(encodeURIComponent(snap()))),"Uppdaterad via webbredigering");bar("Sparat! Ändringen syns på sidan om cirka en minut.")}catch(e){bar("Kunde inte spara (fel "+e.message+"). Kontrollera uppgifterna under menyn.")}}
const EJ=()=>C.site.ejs||{};
async function signup(f){const m=f.querySelector(".msg"),btn=f.querySelector("button"),j=EJ(),b=C.pages[cur()].blocks.find(x=>x.t==="signup")||{},tv=CUR?CUR.name:"",tpl=(CUR&&CUR.tpl)||b.tpl;
if(!j.service||!j.key||!tpl){if(CUR&&!f.dataset.counted){f.dataset.counted=1;hit(CUR,+(CUR.per||2))}location.href=`mailto:${C.site.email}?subject=${encodeURIComponent("Anmälan: "+tv+(CUR?" ("+CUR.date+")":""))}&body=${encodeURIComponent(`Tävling: ${tv}\nNamn: ${f.namn.value.trim()}\nPartner: ${f.partner.value.trim()}\nTelefon: ${f.tel.value.trim()}\nMejl: ${f.epost.value.trim()}`)}`;m.textContent="Ditt mejlprogram öppnas med anmälan ifylld – tryck Skicka där för att bli anmäld.";return}
const prm={tavling:tv,namn:f.namn.value.trim(),partner:f.partner.value.trim(),telefon:f.tel.value.trim(),epost:f.epost.value.trim(),to_email:f.epost.value.trim(),reply_to:C.site.email,admin_email:C.site.email};
const go=t=>fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:j.service,template_id:t,user_id:j.key,template_params:prm})}).then(r=>{if(!r.ok)throw new Error(r.status)});
btn.disabled=true;m.textContent="Skickar anmälan…";
try{await go(tpl);if(CUR)await hit(CUR,+(CUR.per||2));if(j.admin)await go(j.admin).catch(()=>{});f.innerHTML=`<h3>Tack för er anmälan!</h3><p>Vi har skickat ett mejl med mer information om ${esc(tv)} till ${esc(prm.epost)}. Hittar ni det inte, titta i skräpposten.</p>`}
catch(x){btn.disabled=false;m.textContent="Något gick fel och anmälan skickades inte. Försök igen eller mejla oss på "+C.site.email+"."}}
const shrink=f=>new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(f.type==="image/png"?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.85))};i.onerror=no;i.src=u});
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
const sc=()=>{const y=scrollY,c=document.documentElement.classList;if(y>60)c.add("scrolled");else if(y<10)c.remove("scrolled")};addEventListener("scroll",sc,{passive:true});sc();
document.addEventListener("error",e=>{if(e.target.tagName==="IMG"){const w=e.target.parentElement;e.target.remove();if(w&&w.classList.contains("imw"))w.classList.add("ph")}},true);
document.addEventListener("input",e=>{const d=e.target.dataset||{};if(d.p)set(d.p,e.target.textContent);else if(d.ml!==undefined)C.menu[+d.ml].label=e.target.value;else if(d.gh)GHs({[d.gh]:e.target.value.trim()});else if(d.ctpl!==undefined){if(CUR)CUR.tpl=e.target.value.trim()}else if(d.ejs){C.site.ejs=EJ();C.site.ejs[d.ejs]=e.target.value.trim()}});
document.addEventListener("change",e=>{const t=e.target.dataset||{};if(t.sts){set(t.sts,e.target.value);render()}else if(t.cnt!==undefined){const r=ROWS().find(x=>x.id===t.cnt);if(r){r.adj=Math.max(0,+e.target.value||0)-(HITS[r.id]||0);paint()}}else if(t.max){set(t.max,e.target.value===""?"":String(Math.max(0,+e.target.value||0)))}else if(t.per){set(t.per,+e.target.value)}else if(t.to){set(t.to,e.target.value);render()}else if(t.io){const[u,o]=parse(get(t.io));o[t.k]=e.target.value;set(t.io,put(u,o));render()}else if(t.hh){C.pages[cur()].blocks[+t.hh].hh=e.target.value;render()}else if(t.base!==undefined){C.site.base=e.target.value.trim()}});
document.addEventListener("submit",e=>{if(e.target.id==="signup"){e.preventDefault();if(!edit)signup(e.target);return}if(e.target.id!=="form")return;e.preventDefault();if(edit)return;const f=e.target;location.href=`mailto:${C.site.email}?subject=${encodeURIComponent("Intresseanmälan: "+f.typ.value)}&body=${encodeURIComponent(`Namn: ${f.namn.value}\nTelefon: ${f.tel.value}\nAntal: ${f.antal.value}\n\n${f.msg.value}`)}`});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a],[data-add],[data-del],[data-img],[data-mv],[data-rm],[data-nb],[data-st],[data-imgx],[data-newpage],[data-mdel]");if(!t)return;const d=t.dataset,pg=()=>C.pages[cur()].blocks;
if(d.a==="edit"){edit=true;render()}
else if(d.a==="cancel"){location.reload()}
else if(d.a==="ghsave"){ghSave()}
else if(d.a==="dl"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([snap()],{type:"text/html"}));a.download="index.html";document.body.append(a);a.click();a.remove()}
else if(d.a==="save"){bar("Sparar…");try{await(await claude.use("artifact")).publish(snap())}catch(x){bar("Kunde inte spara: "+(x&&x.code||"försök igen"))}}
else if(d.imgx){set(d.imgx,put("",parse(get(d.imgx))[1]));render()}
else if(d.newpage!==undefined){let n=1;while(C.pages["sida-"+n])n++;const k="sida-"+n;C.pages[k]={blocks:[{t:"h1",x:"Ny sida"},{t:"p",x:"Skriv din text här."}]};C.menu.push({label:"Ny sida",page:k});location.hash="#/"+k}
else if(d.mdel!==undefined){C.menu.splice(+d.mdel,1);render()}
else if(d.add&&(get(d.add.split(".").slice(0,-1).join("."))||{}).t==="score"){get(d.add).push({name:"Ny tävling",date:"Datum",status:"soon",id:"",tpl:"",max:"",adj:0,per:2});render()}
else if(d.add){const a=get(d.add),n={},bt=(get(d.add.split(".").slice(0,-1).join("."))||{}).t,base=a[0]||{score:{name:"",date:"",status:"",id:"",tpl:""},list:{h:"",x:""},cards:{img:"",h:"",x:""}}[bt]||{};for(const k in base)n[k]=k==="img"||k==="id"||k==="tpl"||k==="to"?"":k==="status"?"open":k==="name"?"Ny tävling":k==="date"?"Datum":"Ny text";a.push(n);render()}
else if(d.del){const k=d.del.split("."),i=k.pop();get(k.join(".")).splice(+i,1);render()}
else if(d.mv){const a=pg(),i=+d.mv,j=i+ +d.d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];render()}}
else if(d.rm){pg().splice(+d.rm,1);render()}
else if(d.nb){pg().push(JSON.parse(JSON.stringify(NEW[d.nb])));render()}
else if(d.st){if(edit){const o=["open","full","done","soon"];set(d.st,o[(o.indexOf(get(d.st))+1)%o.length]);render()}}
else if(d.img){const f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=async()=>{try{set(d.img,put(await shrink(f.files[0]),parse(get(d.img))[1]));render()}catch(x){bar("Bilden kunde inte läsas")}};f.click()}});
render();
if(window.claude&&claude.use)claude.use("user").then(u=>{if(u&&u.canEdit()){U=u;bar()}}).catch(()=>{});
</script>
