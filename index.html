nger och andra aktiviteter."},{"t":"h3","x":"Teman"},{"t":"p","x":"Om ni delar andra intressen än golf hjälper vi gärna till. Ni kanske vill se en basket- eller fotbollsmatch eller själva spela padel eller tennis. Andra teman som är populära är vinprovning eller en rolig quizkväll.\nKontakta oss så hjälper vi till med det där lilla extra."},{"t":"btn","x":"Anmäl intresse","to":"intresseanmalan"}]},"tavla-mot-andra":{"blocks":[{"t":"h1","x":"Tävla mot andra"},{"t":"img","img":"bilder/2022/08/pb_hole15_01-1-LPT-1600x1208-1-1024x773.jpeg|w=100|a=c|r=3/1"},{"t":"h2","x":"Spela tillsammans mot andra kompisgäng"},{"t":"p","x":"Anmäl ditt kompisgäng och när ni vill spela, hur många ni är och vart ni skulle vilja spela så hittar vi en bra golfbana och trevliga motståndare."},{"t":"h3","x":"Så går det till"},{"t":"h4","x":"Intresseanmälan"},{"t":"p","x":"Ni fyller i information om er själva. Hur många ni är, spelstandard, era prioriteringar (närhet till banan, spela riktigt mycket golf, bra hotell, god mat osv), ålder, kön och när ni vill åka. Sedan försöker vi matcha er mot ett annat gäng som passar er profil. Vi föreslår sedan en lämplig golfbana (i Sverige eller utomlands) och när ni skulle kunna åka."},{"t":"h4","x":"På plats"},{"t":"p","x":"Vi finns på plats och tar hand om alla praktikaliteter när ni spelar. Ni kommer att bli riktigt väl omhändertagna och vi ska försöka få till en extra bra vistelse förutom en rolig golftävling."},{"t":"btn","x":"Anmäl intresse","to":"intresseanmalan"},{"t":"it","img":"bilder/2022/08/ob_estland_prnubaygolflinks_18th.jpeg","h":"En bra golfbana","x":"Det finns förstås olika lyxiga golfbanor. Vi föreslår en eller flera banor som passar era önskemål.","to":""},{"t":"it","img":"bilder/2023/02/Offert-Vesterby-konf-golfpaket-2-scaled.jpg","h":"Hotell vid golfbanan","x":"Oftast föreslår vi boende som ligger direkt vid golfbanan.","to":""},{"t":"it","img":"bilder/2022/12/1600_900_false_false_db045ec10fd1ca018b92d2780550676c.jpeg","h":"En bra re no är en bra anläggning med prisvärd golf och boende."},{"img":"bilder/2022/12/20160531_Parnu_Bay_Golf_Links_Course_JM_0010.JPG-1600x1014-1.jpg|r=1/1|w=100","h":"Pärnu Golf Bay","x":"Vill man prova något nytt och riktigt lyxigt är Pärnu Golf Bay i Estland ett spännande alternativ."}]},{"t":"h3","x":"Företagsgolf"},{"t":"h4","x":"För företagets anställda"},{"t":"p","x":"Låt golfen bli en gemensam aktivitet på företaget. Bjud in kollegorna till en rolig golftävling. Vi ordnar allt från inbjudan till att boka starttider, prisbord och kanske en gemensam lunch eller middag efter tävlingen. Om ni har verksamhet på flera platser i landet kan vi ordna lokala deltävlingar med efterföljande finalspel."},{"t":"h4","x":"För era viktigaste kunder"},{"t":"p","x":"Det är alltid uppskattat att bli inbjuden till en golftävling. Ta tillfället i akt och presentera nya medarbetare, nya tjänster eller produkter eller gör ett seminarium efter tävlingen då ni bjuder in någon intressant föredragshållare. Kontakta gärna oss om ni vill ta hjälp."},{"t":"btn","x":"Intresseanmälan","to":"intresseanmalan"}]},"sponsortavlingar":{"blocks":[{"t":"h1","x":"Sponsortävlingar"},{"t":"img","img":"bilder/2023/10/Skarmavbild-2023-10-20-kl.-17.13.31.png|w=75|r=4/3"},{"t":"h2","x":"Vi genomför tävlingar för våra sponsorer"},{"t":"p","x":"Marknadsföring via golftävlingar är en spännande möjlighet för varumärken som vill nå ut till sina kunder. Men det gäller att göra ett riktigt bra event där både sponsorer, golfklubbar och de tävlande blir nöjda. Det ska vara Win Win."},{"t":"h3","x":"Vi ordnar allt."},{"t":"h4","x":"Allt från att boka, marknadsföra och genomföra."},{"t":"p","x":"Vi bokar in tävlingen på en bra golfklubb i Sverige.\nVi hjälper klubbarna med marknadsföringen av tävlingen.\nVi planerar och genomför tävlingarna på plats.\nVi dokumenterar och rapporterar i sociala medier"},{"t":"h4","x":"Framgångsfaktorer"},{"t":"p","x":"Att vi är ute i god tid.\nAtt vi är tydliga med syfte, mål och budskap.\nAtt vi är på plats och tar ansvar.\nAtt vi utvärderar och mäter effekterna."},{"t":"btn","x":"Intresseanmälan","to":"intresseanmalan"},{"t":"cards","items":[{"img":"bilder/2023/06/IMG_5787.jpeg|w=100|r=4/3","h":"Huvudsponsor","x":"Huvudsponsorn för tävlingen är med och planerar tävlingens utformning, namn och omfattning."},{"img":"bilder/2023/10/IMG_5841-scaled.jpg|r=4/3|w=100","h":"Delsponsorer","x":"Som delsponsor får man möjlighet att synas och kommunicera med sin målgrupp."},{"img":"bilder/2023/10/Skarmavbild-2023-10-27-kl.-18.37.40.png|w=100|r=4/3","h":"Aktiviteter","x":"För att tävlingen ska bli lyckad och omtyckt föreslår vi lämpliga aktiviteter ute på banan."},{"img":"bilder/2023/10/Skarmavbild-2023-10-27-kl.-18.39.57.png|w=100|r=4/3","h":"Marknadsföring","x":"Före, under och efter tävlingen ger naturliga möjligheter att kommunicera med målgruppen."}]}]},"om-oss":{"blocks":[{"t":"h1","x":"Vårt team"},{"t":"img","img":"bilder/bild-1791656302194-1.png|w=25|l=w"},{"t":"h2","x":"Vi älskar att tävla."},{"t":"p","x":"Vi satte oss ned en kväll och pratade om vad vi allra helst skulle vilja göra. Vi spelar alla mycket golf och vi älskar att tävla. Vi har upplevt allt från stora Europatouren till den lilla golfresan med sonen. Vi har lärt oss att uppskatta vad som är bra och undvika det som kan gå dåligt. Tänk om vi kunde hjälpa andra att både få göra den perfekta golfresan och samtidigt tävla som lag!\nDär och då föddes Win Win Golf."},{"t":"cards","items":[{"img":"bilder/2022/10/teamstaffan-1024x768.jpg|w=100|r=4/3","h":"Staffan Hallberg","x":"Founder\n+46708669700\nstaffan@winwingolf.se"},{"img":"bilder/2022/10/teammikael2.jpg|w=100|r=4/3","h":"Mikael Guslin","x":"CFO\n+46707136722\nmikael@winwingolf.se"},{"img":"bilder/2023/08/thumbnail_Skarmavbild-2023-08-16-kl.-12.23.-png.png|w=100|r=4/3","h":"Henrik Hallberg","x":"CEO\n+46732565635\nhenrik@winwingolf.se"},{"img":"bilder/2022/10/teammikael1-1024x768.jpg|w=100|r=4/3","h":"Mikael Andersson","x":"Destinationsansvarig\n+46708621170"}]}]},"anmalan":{"blocks":[{"t":"h1","x":"{tävling}"},{"t":"lead","x":"{datum}"},{"t":"signup","tpl":""}]},"betalning":{"blocks":[{"t":"h1","x":"Betalning"},{"t":"pay","note":"Kortbetalning och Swish öppnar inom kort. Er anmälan blir klar när betalningen är gjord, och då får ni en bekräftelse via mejl.\n(Testtext – ändra med knappen ”Redigera sidan”.)"}]},"ftg":{"blocks":[{"t":"fsign"}]},"betald":{"blocks":[{"t":"h1","x":"Tack för er betalning!"},{"t":"done","x":"Er anmälan är klar. Kvittot på betalningen kommer i ett separat mejl. Välkomna – vi ses på banan!"}]},"intresseanmalan":{"blocks":[{"t":"h1","x":"Intresseanmälan"},{"t":"p","x":"Berätta kort vad ni vill göra, så hör vi av oss."},{"t":"form"}]}}}</script>

<script>
let C=JSON.parse(document.getElementById("data").textContent),edit=false,U=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=p=>p.split(".").reduce((o,k)=>o[k],C);
const set=(p,v)=>{const k=p.split("."),l=k.pop();k.reduce((o,x)=>o[x],C)[l]=v};
const T=(p,tag="span",cls="")=>`<${tag} data-p="${p}"${cls?` class="${cls}"`:""}${edit?' contenteditable="plaintext-only"':""}>${esc(F(get(p)))}</${tag}>`;
const L=(href,cls,inner)=>edit?`<span class="${cls}">${inner}</span>`:`<a class="${cls}" href="${href}">${inner}</a>`;
const add=p=>edit?`<button class="mini" data-add="${p}">+ Lägg till</button>`:"";
const del=p=>edit?`<button class="mini x" data-del="${p}" aria-label="Ta bort">×</button>`:"";
const parse=v=>{const[u,...r]=v.split("|"),o={};r.forEach(x=>{const i=x.indexOf("=");o[x.slice(0,i)]=x.slice(i+1)});return[u,o]};
const put=(u,o)=>u+Object.entries(o).filter(([k,v])=>v).map(([k,v])=>`|${k}=${v}`).join("");
const src=u=>u.startsWith("u:")?(C.site.base||"https://winwingolf.se/wp-content/uploads/")+u.slice(2):u;
const ST={open:"Öppen",full:"Fullbokad",done:"Genomförd",soon:"Kommande"};
const OPT=(p,k,cur,list)=>`<select data-io="${p}" data-k="${k}" aria-label="${k}">${list.map(([v,l])=>`<option value="${v}"${(cur||"")===v?" selected":""}>${l}</option>`).join("")}</select>`;
const IP=(p,full)=>{if(!edit)return"";const[u,o]=parse(get(p));return `<div class="ic"><button class="mini" data-img="${p}">Byt bild</button>${u?`<button class="mini" data-imgx="${p}">Ta bort bild</button>`:""}${full?"":OPT(p,"w",o.w,[["","Bredd: auto"],["25","25 %"],["33","33 %"],["50","50 %"],["66","66 %"],["75","75 %"],["100","100 %"]])+OPT(p,"r",o.r,[["","Form: original"],["16/9","16:9"],["3/2","3:2"],["4/3","4:3"],["1/1","Kvadrat"],["21/9","Bred 21:9"],["3/1","Banner 3:1"]])+OPT(p,"a",o.a,[["","Vänster"],["c","Mitten"],["r","Höger"]])+OPT(p,"l",o.l,[["","Färg: original"],["w","Vit logga (mörk i ljust läge)"],["d","Mörk logga (ljus i mörkt läge)"]])}</div>`};
const IM=(p,c="",hero)=>{const[u,o]=parse(get(p));let st="";if(!hero)st=`width:${o.w?o.w+"%":(u?"fit-content":"100%")};max-width:100%;`+(o.a==="c"?"margin-inline:auto;":o.a==="r"?"margin-left:auto;":"")+(o.r?`aspect-ratio:${o.r};`:"");
const w=`<div class="imw ${c}${o.l?" l"+o.l:""}${o.r&&!hero?" fx":""}${u?"":" ph"}"${st?` style="${st}"`:""}>${u?`<img src="${esc(src(u))}" alt=""${u===C.site.logo?' class="logo-fx"':""}>`:""}</div>`;return hero?w:`<div class="imx">${w}${IP(p)}</div>`};
const PL={hem:"Startsida",intresseanmalan:"Intresseanmälan",anmalan:"Anmälan",betalning:"Betalning",betald:"Betalning klar",ftg:"Företagstävling"};
const TO=p=>edit?`<select class="to" data-to="${p}.to" aria-label="Länk till sida"><option value="">Ingen länk</option>${Object.keys(C.pages).filter(k=>!["anmalan","betalning","betald","ftg"].includes(k)).map(k=>`<option value="${k}"${get(p+".to")===k?" selected":""}>Länk: ${esc(PL[k]||k)}</option>`).join("")}${ROWS().map(r=>`<option value="anmalan/${esc(r.id)}"${get(p+".to")==="anmalan/"+r.id?" selected":""}>Anmälan: ${esc(r.name)}</option>`).join("")}</select>`:"";
const MORE=(b,P)=>(b.to?L("#/"+b.to,"more",b.more!=null?T(P+".more"):"Läs mer &gt;"):"")+TO(P);
const W=x=>`<section class="s"><div class="wrap">${x}</div></section>`;
const B={
h1:(b,P)=>W(T(P+".x","h1")),
score:(b,P)=>W(`<div class="card">${T(P+".h","h2")}<div class="scroll"><table class="tbl"><thead><tr><th>Tävling</th><th>Datum</th><th>Status</th><th>Anmälan</th><th>Antal spelare</th></tr></thead><tbody>${b.rows.map((r,i)=>{const R=P+".rows."+i;

const an=edit?`<span class="btn sm">Anmäl dig här</span><br>${TO(R).replace('<option value="">Ingen länk</option>','<option value="">Ingen knapp</option>')}`:!r.to?`<span class="na">–</span>`:r.status==="open"?`<a class="btn sm" href="#/${esc(r.to)}">Anmäl dig här</a>`:`<span class="na">${{soon:"Öppnar snart",full:"Fullbokad",done:"Avslutad"}[r.status]||"–"}</span>`;
const ap=edit?`<label class="sub">Anmälda <input type="number" min="0" data-cnt="${esc(r.id)}" value="${cnt(r)}"></label><label class="sub">Max platser <input type="number" min="0" data-max="${R}.max" value="${esc(r.max||"")}"></label><label class="sub">Per anmälan <select data-per="${R}.per">${[1,2,3,4].map(n=>`<option value="${n}"${+(r.per||2)===n?" selected":""}>${n} spelare</option>`).join("")}</select></label>`:`<span class="cv" data-cv="${esc(r.id)}">${fmt(r)}</span>`;
return `<tr><td>${T(R+".name")}${del(R)}</td><td>${T(R+".date")}</td><td>${st}</td><td>${an}</td><td>${ap}</td></tr>`}).join("")}</tbody></table></div>${add(P+".rows")}</div>`),
hero:(b,P,i)=>`<div class="hero" style="min-height:min(60vh,${b.hh||26}rem)">${IM(P+".img","",1)}<div class="wrap">${IP(P+".img",1)}${edit?`<div class="ic"><select data-hh="${i}" aria-label="Höjd">${[[14,"Låg"],[20,"Mellan"],[26,"Hög"],[34,"Extra hög"]].map(([v,l])=>`<option value="${v}"${+(b.hh||26)===v?" selected":""}>Höjd: ${l}</option>`).join("")}</select></div>`:""}${T(P+".h","h1")}</div></div>`,
h2:(b,P)=>W(T(P+".x","h2")),h3:(b,P)=>W(T(P+".x","h3")),h4:(b,P)=>W(T(P+".x","h4")),
p:(b,P)=>W(T(P+".x","p")),lead:(b,P)=>W(T(P+".x","p","lead")),
btn:(b,P)=>W(L("#/"+b.to,"btn",T(P+".x"))+TO(P)),
img:(b,P)=>W(IM(P+".img","pic")),
it:(b,P,i,n)=>W(`<div class="it${n%2?" r":""}">${IM(P+".img")}<div>${T(P+".h","h2")}${T(P+".x","p")}${MORE(b,P)}</div></div>`),
banner:(b,P)=>W(`<div class="ban">${IM(P+".img")}<div>${T(P+".h","h3")}${T(P+".sub","h2")}${T(P+".date","p","date")}${MORE(b,P)}</div></div>`),
quote:(b,P)=>`<section class="q"><div class="wrap">${T(P+".x","p")}</div></section>`,
list:(b,P)=>W(T(P+".h","h3")+`<ul class="help">${b.items.map((c,j)=>`<li><strong>${T(P+".items."+j+".h")}</strong>${T(P+".items."+j+".x")}${del(P+".items."+j)}</li>`).join("")}</ul>${add(P+".items")}`),
cards:(b,P)=>W(`<div class="cards">${b.items.map((c,j)=>`<div class="c">${IM(P+".items."+j+".img")}${T(P+".items."+j+".h","h3")}${T(P+".items."+j+".x","p")}${del(P+".items."+j)}</div>`).join("")}</div>${add(P+".items")}`),
